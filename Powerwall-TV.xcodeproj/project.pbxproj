			shellPath = /bin/sh;
			shellScript = "if [ \"${PLATFORM_NAME}\" != \"macosx\" ]; then\n  exit 0\nfi\n# CI passes CODE_SIGNING_ALLOWED=NO and has no Mac app-group profile. Xcode\n# fails the build if this script prints a line that starts with \"error:\".\nif [ \"${CODE_SIGNING_ALLOWED}\" = \"NO\" ] || [ -z \"${EXPANDED_CODE_SIGN_IDENTITY}\" ] || [ \"${EXPANDED_CODE_SIGN_IDENTITY}\" = \"-\" ]; then\n  echo \"note: code signing is off; skipping macOS widget app-group re-sign\"\n  exit 0\nfi\nEMBEDDED=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/PlugIns/PowerwallEnergyWidget.appex\"\nSTANDALONE=\"${TARGET_BUILD_DIR}/PowerwallEnergyWidget.appex\"\nENT=\"${SRCROOT}/PowerwallEnergyWidget/PowerwallEnergyWidget-macOS.entitlements\"\nif [ ! -d \"${EMBEDDED}\" ] || [ ! -f \"${ENT}\" ]; then\n  echo \"error: macOS energy widget is missing its appex or entitlements\" >&2\n  exit 1\nfi\nPROFILE_DIR=\"${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles\"\nPROFILE=\"$(/usr/bin/python3 - \"${PROFILE_DIR}\" << 'SELECT'\nimport glob, os, plistlib, subprocess, sys\nfolder = sys.argv[1]\nbest = None\nbest_score = -1\nfor path in glob.glob(os.path.join(folder, \"*.provisionprofile\")):\n    raw = subprocess.check_output([\"security\", \"cms\", \"-D\", \"-i\", path])\n    start = raw.find(b\"<?xml\")\n    if start < 0:\n        start = raw.find(b\"<plist\")\n    if start < 0:\n        continue\n    data = plistlib.loads(raw[start:])\n    ent = data.get(\"Entitlements\") or {}\n    teams = list(data.get(\"TeamIdentifier\") or [])\n    app_id = str(ent.get(\"com.apple.application-identifier\") or \"\")\n    groups = list(ent.get(\"com.apple.security.application-groups\") or [])\n    if \"4P8S9W2NYL\" not in teams:\n        continue\n    if not app_id.startswith(\"4P8S9W2NYL.\"):\n        continue\n    if \"group.com.sighmon.Powerwall-TV\" not in groups:\n        continue\n    if \"8WCLFC2272\" in app_id:\n        continue\n    name = str(data.get(\"Name\") or \"\")\n    score = 0\n    if app_id == \"4P8S9W2NYL.com.sighmon.Powerwall-TV.EnergyWidget\":\n        score += 100\n    elif app_id == \"4P8S9W2NYL.com.sighmon.Powerwall-TV\":\n        score += 50\n    if \"Store\" in name:\n        score -= 20\n    if score > best_score:\n        best_score = score\n        best = path\nif not best:\n    sys.exit(\"error: no Mac profile for team 4P8S9W2NYL authorizes group.com.sighmon.Powerwall-TV\")\nprint(best)\nSELECT\n)\"\nif [ ! -f \"${PROFILE}\" ]; then\n  echo \"error: selected app-group profile is missing\" >&2\n  exit 1\nfi\nAPP=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\nAPP_XCENT=\"${DERIVED_FILE_DIR}/Powerwall-TV-app.xcent\"\nSIGN_ENT=\"${DERIVED_FILE_DIR}/PowerwallEnergyWidget-macOS.xcent\"\n/usr/bin/codesign -d --entitlements :- \"${APP}\" > \"${APP_XCENT}\"\ncp \"${ENT}\" \"${SIGN_ENT}\"\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n  /usr/libexec/PlistBuddy -c \"Add :com.apple.security.get-task-allow bool true\" \"${SIGN_ENT}\" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c \"Set :com.apple.security.get-task-allow true\" \"${SIGN_ENT}\"\nfi\nsign_widget() {\n  cp \"${PROFILE}\" \"$1/Contents/embedded.provisionprofile\"\n  /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --entitlements \"${SIGN_ENT}\" --timestamp=none --generate-entitlement-der \"$1\"\n}\nsign_widget \"${EMBEDDED}\"\nif [ -d \"${STANDALONE}\" ]; then\n  sign_widget \"${STANDALONE}\"\nfi\n/usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --entitlements \"${APP_XCENT}\" --timestamp=none --generate-entitlement-der \"${APP}\"\n/usr/bin/python3 - \"${EMBEDDED}\" << 'CHECK'\nimport plistlib, subprocess, sys\nappex = sys.argv[1]\nraw = subprocess.check_output([\"codesign\", \"-d\", \"--entitlements\", \":-\", appex], stderr=subprocess.DEVNULL)\nstart = raw.find(b\"<?xml\")\nif start < 0:\n    start = raw.find(b\"<plist\")\nif start < 0:\n    start = raw.find(b\"bplist\")\nent = plistlib.loads(raw[start:])\nprof_raw = subprocess.check_output([\"security\", \"cms\", \"-D\", \"-i\", appex + \"/Contents/embedded.provisionprofile\"])\nps = prof_raw.find(b\"<?xml\")\nif ps < 0:\n    ps = prof_raw.find(b\"<plist\")\ndata = plistlib.loads(prof_raw[ps:])\npe = data.get(\"Entitlements\") or {}\napp_id = ent.get(\"com.apple.application-identifier\") or \"\"\np_id = pe.get(\"com.apple.application-identifier\") or \"\"\ngroups = ent.get(\"com.apple.security.application-groups\") or []\npgroups = pe.get(\"com.apple.security.application-groups\") or []\nteams = list(data.get(\"TeamIdentifier\") or [])\nprint(\"widget application-identifier\", app_id)\nprint(\"profile name\", data.get(\"Name\"))\nprint(\"profile application-identifier\", p_id)\nprint(\"profile team\", teams)\nprint(\"widget groups\", groups)\nprint(\"profile groups\", pgroups)\nok = (\n    str(app_id).startswith(\"4P8S9W2NYL.\")\n    and str(p_id).startswith(\"4P8S9W2NYL.\")\n    and \"8WCLFC2272\" not in str(app_id)\n    and \"8WCLFC2272\" not in str(p_id)\n    and \"4P8S9W2NYL\" in teams\n    and \"group.com.sighmon.Powerwall-TV\" in groups\n    and \"group.com.sighmon.Powerwall-TV\" in pgroups\n)\nif not ok:\n    sys.exit(\"error: macOS widget signature does not authorize the app group under prefix 4P8S9W2NYL\")\nCHECK\n";
